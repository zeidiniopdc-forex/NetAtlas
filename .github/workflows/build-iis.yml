name: Build for IIS (Offline Package)

on:
  workflow_dispatch:
  push:
    branches: [ main, netatlas-v2-production, netatlas-v3-production ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Download Vazirmatn fonts
        run: |
          mkdir -p public/fonts
          curl -sL -o /tmp/vazirmatn.zip "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip"
          unzip -o -q /tmp/vazirmatn.zip "fonts/webfonts/Vazirmatn-Regular.woff2" "fonts/webfonts/Vazirmatn-Medium.woff2" "fonts/webfonts/Vazirmatn-SemiBold.woff2" "fonts/webfonts/Vazirmatn-Bold.woff2" -d /tmp/vazir
          cp /tmp/vazir/fonts/webfonts/Vazirmatn-Regular.woff2 public/fonts/
          cp /tmp/vazir/fonts/webfonts/Vazirmatn-Medium.woff2 public/fonts/
          cp /tmp/vazir/fonts/webfonts/Vazirmatn-SemiBold.woff2 public/fonts/
          cp /tmp/vazir/fonts/webfonts/Vazirmatn-Bold.woff2 public/fonts/

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build for Node.js (IIS)
        run: |
          sed -i 's/preset: "vercel"/preset: "node-server"/g' vite.config.ts
          npm run build
        env:
          NODE_ENV: production

      - name: Prepare IIS package
        run: |
          mkdir -p iis-package
          if [ -d ".output" ]; then
            cp -r .output/* iis-package/
          elif [ -d ".vercel/output" ]; then
            cp -r .vercel/output/* iis-package/
          else
            echo "ERROR: No build output found!"
            exit 1
          fi

          mkdir -p iis-package/public/fonts
          cp -r public/fonts/* iis-package/public/fonts/ 2>/dev/null || true
          mkdir -p iis-package/fonts
          cp -r public/fonts/* iis-package/fonts/ 2>/dev/null || true
          cp iis/web.config iis-package/web.config
          mkdir -p iis-package/logs

          # Bundled sample data (read by store fallback when runtime data is empty)
          mkdir -p iis-package/data
          if [ -f data/inventory.json ]; then
            cp data/inventory.json iis-package/data/inventory.json
          fi

          cat > iis-package/DATA-LOCATION.txt << 'EOF'
NetAtlas v3 — مسیر داده روی IIS

1) پوشه runtime را بسازید (خارج از site):
   D:\NetAtlas\data

2) به هویت App Pool دسترسی Modify بدهید:
   IIS AppPool\YourSiteName

3) در web.config مقدار زیر تنظیم شده:
   INVENTORY_DATA_DIR = D:/NetAtlas/data

4) اگر inventory.json در آن مسیر خالی باشد، اپ از data/inventory.json
   داخل پکیج (نمونه) seed می‌کند و در مسیر runtime ذخیره می‌کند.

5) لاگ‌ها: .\logs\node
EOF

          echo "Package branch: ${GITHUB_REF_NAME:-unknown}" > iis-package/PACKAGE-INFO.txt
          echo "Built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> iis-package/PACKAGE-INFO.txt
          echo "NetAtlas version track: v3" >> iis-package/PACKAGE-INFO.txt

          sed -i 's|arguments="\\.\\\\.output\\\\server\\\\index\\.mjs"|arguments=".\\server\\index.mjs"|g' iis-package/web.config || true
          sed -i 's|arguments="\\./\\.output/server/index\\.mjs"|arguments="./server/index.mjs"|g' iis-package/web.config || true
          if ! grep -q NODE_SKIP_PLATFORM_CHECK iis-package/web.config; then
            sed -i 's|</environmentVariables>|<environmentVariable name="NODE_SKIP_PLATFORM_CHECK" value="1" />\n      </environmentVariables>|' iis-package/web.config || true
          fi
          find iis-package -type f | head -120

      - name: Upload IIS package
        uses: actions/upload-artifact@v4
        with:
          name: NetAtlas-IIS-${{ github.ref_name }}
          path: iis-package/
          retention-days: 14
          if-no-files-found: error
